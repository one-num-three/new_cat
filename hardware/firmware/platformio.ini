; 猫鼠手环 V1.5 固件 —— Seeed XIAO ESP32C3
; 构建：pio run      烧录：pio run -t upload      串口：pio device monitor

[env:xiao_esp32c3]
platform = espressif32@6.9.0          ; Arduino-ESP32 2.0.x
board = seeed_xiao_esp32c3
framework = arduino
monitor_speed = 115200
board_build.partitions = huge_app.csv
build_flags =
    -DCORE_DEBUG_LEVEL=1
lib_deps =
    adafruit/Adafruit NeoPixel@^1.12.3
    h2zero/NimBLE-Arduino@~1.4.3

; 4 层 EVT 主板。WROOM-02 参考板和 MINI-1 Strap-Halo 使用同一套 GPIO 定义。
[env:evt_4layer_pcb]
extends = env:xiao_esp32c3
board = esp32-c3-devkitm-1
build_flags =
    -DCORE_DEBUG_LEVEL=1
    -DCATMOUSE_EVT_4LAYER_PCB
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
