body{margin:0;padding:24px;background:#fcf8ed;color:#243b31;font:16px/1.7 CatMouseFusionUI,system-ui,sans-serif}main{max-width:900px;margin:auto}h1{font-size:26px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}.card{padding:16px;border:1px solid #d3d8c8;background:#fffdf1}.card label{display:block;font-size:14px;margin-bottom:8px}.signalChip{cursor:pointer}.small{width:320px;max-width:100%;padding:12px;box-sizing:border-box;border:2px solid #72856c;display:flex;gap:12px;flex-wrap:wrap}a{color:#356b49}p{max-width:760px}</style><main><h1>定位信号格 + 精度数值</h1><p>已接入地图左上角和准备页。这是产品组件样式的桌面预览，<strong>不是微信截图</strong>。示例数值均为测试数据。点击小信号查看解释。</p><section class="grid"><div class="card"><label>精度较好</label><button class="signalChip good" style="--signal-font-scale:1" data-detail="4 / 4格，定位精度估计为±5m，0秒前更新。数值越小越好；实际误差可能更大，准备和抓捕仍由服务端校验。"><span class="signalBars" aria-hidden="true"><span class="signalBar lit" style="height:7px"></span><span class="signalBar lit" style="height:10px"></span><span class="signalBar lit" style="height:13px"></span><span class="signalBar lit" style="height:16px"></span></span><span class="signalText">±5m</span></button></div><div class="card"><label>精度正常</label><button class="signalChip good" style="--signal-font-scale:1" data-detail="3 / 4格，定位精度估计为±8m，0秒前更新。数值越小越好；实际误差可能更大，准备和抓捕仍由服务端校验。"><span class="signalBars" aria-hidden="true"><span class="signalBar lit" style="height:7px"></span><span class="signalBar lit" style="height:10px"></span><span class="signalBar lit" style="height:13px"></span><span class="signalBar " style="height:16px"></span></span><span class="signalText">±8m</span></button></div><div class="card"><label>精度一般</label><button class="signalChip fair" style="--signal-font-scale:1" data-detail="2 / 4格，定位精度估计为±18m，0秒前更新。数值越小越好；实际误差可能更大，准备和抓捕仍由服务端校验。"><span class="signalBars" aria-hidden="true"><span class="signalBar lit" style="height:7px"></span><span class="signalBar lit" style="height:10px"></span><span class="signalBar " style="height:13px"></span><span class="signalBar " style="height:16px"></span></span><span class="signalText">±18m</span></button></div><div class="card"><label>精度偏弱</label><button class="signalChip weak" style="--signal-font-scale:1" data-detail="1 / 4格，定位精度估计为±60m，0秒前更新。超过25米，本次不用于准备和抓捕，请到开阔处等待稳定。"><span class="signalBars" aria-hidden="true"><span class="signalBar lit" style="height:7px"></span><span class="signalBar " style="height:10px"></span><span class="signalBar " style="height:13px"></span><span class="signalBar " style="height:16px"></span></span><span class="signalText">±60m</span></button></div><div class="card"><label>超过5秒未更新</label><button class="signalChip muted" style="--signal-font-scale:1" data-detail="最近一次精度估计为±5m，已超过5秒未更新；不能用旧位置判断当前状态。"><span class="signalBars" aria-hidden="true"><span class="signalBar " style="height:7px"></span><span class="signalBar " style="height:10px"></span><span class="signalBar " style="height:13px"></span><span class="signalBar " style="height:16px"></span></span><span class="signalText">已过期</span></button></div><div class="card"><label>未授权</label><button class="signalChip muted" style="--signal-font-scale:1" data-detail="请在小程序及系统设置中检查定位权限。"><span class="signalBars" aria-hidden="true"><span class="signalBar " style="height:7px"></span><span class="signalBar " style="height:10px"></span><span class="signalBar " style="height:13px"></span><span class="signalBar " style="height:16px"></span></span><span class="signalText">未授权</span></button></div><div class="card"><label>网络未同步</label><button class="signalChip muted" style="--signal-font-scale:1" data-detail="连接中断，地图旧位置已隐藏。恢复连接后重新同步。"><span class="signalBars" aria-hidden="true"><span class="signalBar " style="height:7px"></span><span class="signalBar " style="height:10px"></span><span class="signalBar " style="height:13px"></span><span class="signalBar " style="height:16px"></span></span><span class="signalText">未同步</span></button></div><div class="card"><label>本轮已停止</label><button class="signalChip muted" style="--signal-font-scale:1" data-detail="本轮定位已停止；出局、退出或结算后不会继续采集。"><span class="signalBars" aria-hidden="true"><span class="signalBar " style="height:7px"></span><span class="signalBar " style="height:10px"></span><span class="signalBar " style="height:13px"></span><span class="signalBar " style="height:16px"></span></span><span class="signalText">已停止</span></button></div></section><h2>小屏 / 大字体</h2><p>320px容器，1.3倍字体。</p><div class="small"><button class="signalChip good" style="--signal-font-scale:1.3" data-detail="4 / 4格，定位精度估计为±5m，0秒前更新。数值越小越好；实际误差可能更大，准备和抓捕仍由服务端校验。"><span class="signalBars" aria-hidden="true"><span class="signalBar lit" style="height:7px"></span><span class="signalBar lit" style="height:10px"></span><span class="signalBar lit" style="height:13px"></span><span class="signalBar lit" style="height:16px"></span></span><span class="signalText">±5m</span></button><button class="signalChip good" style="--signal-font-scale:1.3" data-detail="3 / 4格，定位精度估计为±8m，0秒前更新。数值越小越好；实际误差可能更大，准备和抓捕仍由服务端校验。"><span class="signalBars" aria-hidden="true"><span class="signalBar lit" style="height:7px"></span><span class="signalBar lit" style="height:10px"></span><span class="signalBar lit" style="height:13px"></span><span class="signalBar " style="height:16px"></span></span><span class="signalText">±8m</span></button><button class="signalChip fair" style="--signal-font-scale:1.3" data-detail="2 / 4格，定位精度估计为±18m，0秒前更新。数值越小越好；实际误差可能更大，准备和抓捕仍由服务端校验。"><span class="signalBars" aria-hidden="true"><span class="signalBar lit" style="height:7px"></span><span class="signalBar lit" style="height:10px"></span><span class="signalBar " style="height:13px"></span><span class="signalBar " style="height:16px"></span></span><span class="signalText">±18m</span></button><button class="signalChip weak" style="--signal-font-scale:1.3" data-detail="1 / 4格，定位精度估计为±60m，0秒前更新。超过25米，本次不用于准备和抓捕，请到开阔处等待稳定。"><span class="signalBars" aria-hidden="true"><span class="signalBar lit" style="height:7px"></span><span class="signalBar " style="height:10px"></span><span class="signalBar " style="height:13px"></span><span class="signalBar " style="height:16px"></span></span><span class="signalText">±60m</span></button></div><p>4格≤5米，3格≤10米，2格≤25米，1格&gt;25米。超过5秒未更新、未授权、未同步等状态显示灰色。数值是微信回调的定位精度估计，不是卫星信号强度，也不保证实际误差在这个范围内。</p><p>服务端25米精度与5秒位置有效期的校验不变；弱样本不会被放宽用于准备或抓捕。没有新增GPS请求、实时广播或定时器。</p><p><a href="README.md">实现与验证</a> · <a href="signal-tests.log">专项测试</a></p><dialog id="detail"><p></p><button onclick="this.parentElement.close()">知道了</button></dialog><script>document.querySelectorAll(".signalChip").forEach(b=>b.onclick=()=>{const d=document.getElementById("detail");d.querySelector("p").textContent=b.dataset.detail;d.showModal();});</script></main></html>
