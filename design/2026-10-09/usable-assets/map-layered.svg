  </g>
  <g id="layer-self-position" inkscape:groupmode="layer" inkscape:label="03 本人位置与集合点">
    <circle cx="226" cy="890" r="36" fill="#3D9BE8" fill-opacity="0.18"/>
    <circle cx="226" cy="890" r="24" fill="#FFFFFF"/>
    <circle cx="226" cy="890" r="16" fill="#3D9BE8"/>
