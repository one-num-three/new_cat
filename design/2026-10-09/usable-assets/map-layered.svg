    <text x="48" y="160" font-family="Microsoft YaHei,sans-serif" font-weight="800" font-size="39" fill="#213638">已抓 3 / 4</text>
    <text x="683" y="148" text-anchor="end" font-family="Microsoft YaHei,sans-serif" font-weight="800" font-size="50" fill="#213638">04:32</text>
    <text x="682" y="180" text-anchor="end" font-family="Microsoft YaHei,sans-serif" font-size="19" fill="#60756C">剩余时间</text>
    <text x="48" y="198" font-family="Microsoft YaHei,sans-serif" font-size="20" fill="#60756C">实时连接 · 地图按身份显示</text>
  </g>
  <g id="layer-bottom-action" inkscape:groupmode="layer" inkscape:label="05 当前提示与主动作">
    <rect x="22" y="1062" width="706" height="248" rx="30" fill="#FFFFFF"/>
    <text x="49" y="1115" font-family="Microsoft YaHei,sans-serif" font-size="24" fill="#35514B">橘色区域是鼠的大致线索，</text>
    <text x="49" y="1152" font-family="Microsoft YaHei,sans-serif" font-size="24" fill="#35514B">线下接近并停下后扫码。</text>
    <rect x="42" y="1180" width="666" height="79" rx="22" fill="#D95325"/>
    <rect x="42" y="1174" width="666" height="79" rx="22" fill="#F36A34"/>
    <text x="375" y="1224" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-weight="800" font-size="29" fill="#FFFFFF">扫码确认抓捕</text>
    <text x="375" y="1289" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="21" fill="#276B4D">队伍 · 规则 · 操作  ▴</text>
