    <text x="65" y="439" font-family="Microsoft YaHei,sans-serif" font-size="23" fill="#4B6D59">公园入口</text>
    <text x="551" y="606" font-family="Microsoft YaHei,sans-serif" font-size="23" fill="#4B6D59">中央草坪</text>
  </g>
  <g id="layer-server-clue" inkscape:groupmode="layer" inkscape:label="02 服务端授权区域线索 · 无精确点">
