    <g fill="#5CB46E"><circle cx="67" cy="249" r="38"/><circle cx="126" cy="548" r="45"/><circle cx="604" cy="220" r="52"/><circle cx="676" cy="470" r="47"/><circle cx="91" cy="757" r="34"/><circle cx="588" cy="837" r="40"/><circle cx="674" cy="1042" r="41"/><circle cx="204" cy="1108" r="35"/><circle cx="525" cy="1193" r="52"/></g>
