<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>猫鼠行动 · 两张初始地图</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f7f3e6;color:#233a32;font:15px system-ui,"Microsoft YaHei",sans-serif}header{padding:18px 24px;border-bottom:3px solid #234639;display:flex;align-items:center;gap:20px;flex-wrap:wrap}h1{margin:0;font-size:22px}small{color:#586655}button,select{font:inherit;padding:8px 13px;border:2px solid #294b39;background:#fffbed;color:#233a32;cursor:pointer}button:active{background:#b7d876}main{padding:18px 24px}nav{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:14px}#stage{position:relative;box-sizing:content-box;width:calc(100% - 8px);max-width:1200px;margin:auto;background:#9acdce;border:4px solid #385644;box-shadow:7px 7px 0 #d9d8bb}canvas{display:block;width:100%;height:100%;image-rendering:pixelated;touch-action:none}#overlay{position:absolute;inset:0;pointer-events:none;image-rendering:auto}footer{max-width:1200px;margin:14px auto;display:grid;gap:7px}#status{font-weight:650}label{display:flex;align-items:center;gap:5px}.warn{color:#766844;font-size:13px}a{color:#2e694f}#coords{font-variant-numeric:tabular-nums;font-family:monospace} @media(max-width:600px){header,main{padding:12px}h1{font-size:18px}nav{gap:5px}button,select{padding:7px}}</style>
<header><h1>晴日公园 / 两张初始地图</h1><small>真实矢量锁定地形 · 共用 16-bit 像素材质</small></header>
<main><nav><select id="scene" aria-label="地图范围"><option value="small">小图 · 解放门—七星旱桥</option><option value="large">大图 · 环洲—樱洲</option></select><button id="plus" aria-label="放大">＋</button><button id="minus" aria-label="缩小">－</button><button id="rotate">旋转 15°</button><button id="reset">复位</button><label><input id="wire" type="checkbox">真实轮廓</label><label><input id="anchors" type="checkbox">锚点</label><button id="save">导出当前地图</button></nav>
<div id="stage"><canvas id="map" aria-label="真实地理像素地图"></canvas><canvas id="overlay"></canvas></div>
<footer><div id="status">正在载入地理数据与材质…</div><div id="coords">拖动平移 · 滚轮缩放 · 坐标：WGS84</div><small>岸线、道路中心线、桥梁与建筑轮廓均来自 OSM；植被图案只是美术装饰，不表示实测树位。道路宽度含制图默认值。</small><div class="warn">图面配准已验证；高德 GCJ-02 转换及现场定位误差仍待核验。此页面只验证地图，不接入产品。</div><small>© OpenStreetMap contributors · ODbL 1.0 · <a href="registration.json">配准记录</a> · <a href="VERIFICATION.txt">验证记录</a></small></footer></main>
<script src="source-data.js"></script><script>window.CONFIG_FILE=['baseline-config.json','rollback-test.json'].includes(new URLSearchParams(location.search).get('config'))?new URLSearchParams(location.search).get('config'):'maps-config.json';fetch(window.CONFIG_FILE).then(r=>r.json()).then(c=>{window.MAP_CONFIG=c;const s=document.createElement('script');s.src='renderer.js';document.body.appendChild(s);}).catch(e=>document.querySelector('#status').textContent=e.message);</script></html>
