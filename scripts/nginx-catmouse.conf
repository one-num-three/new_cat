# Dedicated path for the cat-mouse pilot API. The trailing slash on proxy_pass
# removes /catmouse/ before the request reaches the Node service.
location = /catmouse { return 301 /catmouse/; }

location = /catmouse/api/v2/live {
    proxy_pass http://127.0.0.1:4000/api/v2/live;
    include snippets/proxy-params.conf;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 45s;
    proxy_send_timeout 45s;
}

location ^~ /catmouse/ {
    proxy_pass http://127.0.0.1:4000/;
    include snippets/proxy-params.conf;
    proxy_http_version 1.1;
    client_max_body_size 32k;
    proxy_read_timeout 30s;
}
